<!-- index.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Muggle's Guide to Grand Tableau</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">
  <h1>The Muggle's Guide to Grand Tableau</h1>
  <h2>A Daily Oracle for Wandless Witches and Wizards</h2>
</div>

<div class="controls">
  <button id="reveal-cards">카드 펼치기</button>
  <button id="shuffle-toggle">셔플 OFF</button>
  <button id="toggle-labels">번호 / 하우스</button>
  <button id="chain-mode">체인 리딩</button>
  <button id="save-reading">리딩 저장</button>
  <button id="oracle-btn">오라클 조언</button>
</div>

<div id="tableau"></div>

<!-- 오라클 모달 -->
<div id="oracle-modal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h3>오늘의 마법 조언</h3>
    <div class="oracle-cards">
      <div class="oracle-card">
        <img id="house-img" src="" alt="House">
        <p id="house-name"></p>
      </div>
      <div class="oracle-card">
        <img id="spell-img" src="" alt="Spell">
        <p id="spell-name"></p>
      </div>
    </div>
    <div id="oracle-message"></div>
    <button id="draw-oracle">조언 뽑기</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/oracleData.js"></script>
<script src="js/gt.js"></script>
<script src="js/oracle.js"></script>

</body>
</html>
